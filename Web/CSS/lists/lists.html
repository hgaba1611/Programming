<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS</title>
    <link rel="stylesheet" href="style.css" type="text/css  ">
</head>

<body>
    <h1>HTML lists</h1>
    <h2>How to style them</h2>



    <div class="ordered">
        <ol>
            <li>Item number 1</li>
            <li>Item number 2</li>
            <li>Item number 3</li>
            <li>Item number 4</li>
        </ol>
    </div>    

    <div class="unordered">
        <ul>
            <li>Item number 1</li>
            <li>Item number 2</li>
            <li>Item number 3</li>
            <li>Item number 4</li>
        </ul>
    </div>
</body>

</html>
