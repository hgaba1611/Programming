    <h2>Our Contact form</h2>

    <fieldset>
        <legend>Send us a message</legend>
        <label for="name">Name:</label>

        <br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your message here..."></textarea>
    </fieldset>
